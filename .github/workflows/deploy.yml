# ============================================================
# Auto Deploy Workflow — nguyen-thi-thu-huong1/002bob-
# Domain: iiit.pro
#   admin.iiit.pro  -> Laravel admin backend (PHP API + dcat-admin)
#   iiit.pro        -> Web/PC frontend
#   m.iiit.pro      -> WAP/Mobile frontend
#
# Required GitHub Secrets (Settings -> Secrets -> Actions):
#   SSH_HOST        -> Server IP or hostname
#   SSH_USER        -> SSH username on the server
#   SSH_KEY         -> Private SSH key (PEM format)
#   SSH_PORT        -> SSH port (default: 22)
#   DB_NAME         -> MySQL database name
#   DB_USER         -> MySQL database username
#   DB_PASSWORD     -> MySQL database password
#   USER_PASSWORD   -> Password for member account alisababi
# ============================================================

name: Auto Deploy to iiit.pro

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      force_import_sql:
        description: "Force re-import SQL dump (overwrites existing data)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    name: Deploy to iiit.pro
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD || '123456' }}
          FORCE_SQL: ${{ github.event.inputs.force_import_sql || 'false' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GH_REPO,GH_BRANCH,DB_NAME,DB_USER,DB_PASSWORD,USER_PASSWORD,FORCE_SQL
          command_timeout: 40m
          script: |
            set -Eeuo pipefail

            DEPLOY_PATH="/var/www/iiit.pro"
            ADMIN_DOMAIN="admin.iiit.pro"
            WEB_DOMAIN="iiit.pro"
            WAP_DOMAIN="m.iiit.pro"
            ADMIN_URL="http://${ADMIN_DOMAIN}"
            DB_NAME="${DB_NAME:-bob002}"
            DB_USER="${DB_USER:-bob002}"
            DB_PASS="${DB_PASSWORD:-}"
            USER_PASSWORD="${USER_PASSWORD:-123456}"
            GH_BRANCH="${GH_BRANCH:-main}"
            REPO_URL="https://github.com/${GH_REPO}.git"
            APACHE_CONF="/etc/apache2/sites-available/iiit.pro.conf"

            echo "========================================"
            echo " Deploy started - $(date)"
            echo " Repo   : ${GH_REPO}"
            echo " Branch : ${GH_BRANCH}"
            echo " Target : ${DEPLOY_PATH}"
            echo "========================================"

            set_env_value() {
              local key="$1"
              local value="$2"
              local file="$3"

              if grep -q "^${key}=" "${file}"; then
                sed -i "s|^${key}=.*|${key}=${value}|" "${file}"
              else
                printf '%s=%s\n' "${key}" "${value}" >> "${file}"
              fi
            }

            # 1. Install packages and enable services
            echo ""
            echo "[1/9] Installing system packages..."

            export DEBIAN_FRONTEND=noninteractive

            if ! command -v php7.4 >/dev/null 2>&1; then
              sudo apt-get install -y software-properties-common -qq
              sudo add-apt-repository ppa:ondrej/php -y
            fi

            sudo apt-get update -qq
            sudo apt-get install -y -qq \
              git curl unzip ufw \
              apache2 \
              php7.4 php7.4-cli php7.4-mysql php7.4-mbstring \
              php7.4-xml php7.4-zip php7.4-fileinfo php7.4-gd \
              php7.4-curl php7.4-bcmath php7.4-tokenizer \
              php7.4-common php7.4-json libapache2-mod-php7.4 \
              mysql-server nodejs npm

            if ! command -v composer >/dev/null 2>&1; then
              curl -sS https://getcomposer.org/installer -o /tmp/composer-setup.php
              sudo php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
            fi

            sudo a2enmod rewrite headers php7.4 ssl
            sudo a2dismod php8.* 2>/dev/null || true
            sudo systemctl enable apache2 mysql
            sudo systemctl restart mysql

            sudo ufw allow 22/tcp >/dev/null 2>&1 || true
            sudo ufw allow 80/tcp >/dev/null 2>&1 || true
            sudo ufw allow 443/tcp >/dev/null 2>&1 || true
            sudo ufw --force enable >/dev/null 2>&1 || true

            echo "System packages ready."

            # 2. Clone or update repository
            echo ""
            echo "[2/9] Deploying source code..."

            sudo mkdir -p "${DEPLOY_PATH}"
            sudo chown -R "${USER}:${USER}" "${DEPLOY_PATH}"

            if [ -d "${DEPLOY_PATH}/.git" ]; then
              cd "${DEPLOY_PATH}"
              git fetch --all --prune
              git checkout "${GH_BRANCH}" 2>/dev/null || git checkout -b "${GH_BRANCH}" "origin/${GH_BRANCH}"
              git reset --hard "origin/${GH_BRANCH}"
              git clean -fd
            else
              git clone --branch "${GH_BRANCH}" "${REPO_URL}" "${DEPLOY_PATH}"
              cd "${DEPLOY_PATH}"
            fi

            echo "Source code deployed."

            # 3. Configure Laravel environment
            echo ""
            echo "[3/9] Configuring Laravel environment..."

            cd "${DEPLOY_PATH}/admin"
            [ -f .env ] || cp .env.example .env

            set_env_value "APP_ENV" "production" ".env"
            set_env_value "APP_DEBUG" "false" ".env"
            set_env_value "APP_URL" "${ADMIN_URL}" ".env"
            set_env_value "DB_CONNECTION" "mysql" ".env"
            set_env_value "DB_HOST" "127.0.0.1" ".env"
            set_env_value "DB_PORT" "3306" ".env"
            set_env_value "DB_DATABASE" "${DB_NAME}" ".env"
            set_env_value "DB_USERNAME" "${DB_USER}" ".env"
            set_env_value "DB_PASSWORD" "${DB_PASS}" ".env"
            set_env_value "CACHE_DRIVER" "file" ".env"
            set_env_value "SESSION_DRIVER" "file" ".env"
            set_env_value "QUEUE_CONNECTION" "sync" ".env"

            echo ".env configured."

            # 4. Install dependencies and build assets
            echo ""
            echo "[4/9] Installing PHP and Node.js dependencies..."

            composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
            grep -q "APP_KEY=base64:" .env || php artisan key:generate --force

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            npm run production || npm run prod || npm run dev

            echo "Dependencies installed."

            # 5. Set up MySQL database
            echo ""
            echo "[5/9] Setting up MySQL database..."

            sudo mysql -u root -e "
              CREATE DATABASE IF NOT EXISTS \`${DB_NAME}\`
                CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE USER IF NOT EXISTS '${DB_USER}'@'localhost'
                IDENTIFIED BY '${DB_PASS}';
              ALTER USER '${DB_USER}'@'localhost'
                IDENTIFIED BY '${DB_PASS}';
              GRANT ALL PRIVILEGES ON \`${DB_NAME}\`.* TO '${DB_USER}'@'localhost';
              FLUSH PRIVILEGES;
            "

            SQL_FILE=$(find "${DEPLOY_PATH}" -maxdepth 1 -name "*.sql" | head -1 || true)
            TABLE_COUNT=$(sudo mysql -u root "${DB_NAME}" -Nse "SHOW TABLES;" 2>/dev/null | wc -l)

            if [ "${FORCE_SQL}" = "true" ] || [ "${TABLE_COUNT}" -lt 5 ]; then
              if [ -n "${SQL_FILE}" ]; then
                echo "Importing SQL dump: ${SQL_FILE}"
                sudo mysql -u root "${DB_NAME}" < "${SQL_FILE}"
              fi
            fi

            php artisan migrate --force

            echo "Database ready."

            # 6. Create or update default user
            echo ""
            echo "[6/9] Creating default member..."

            PHP_HASH=$(php -r "echo password_hash('${USER_PASSWORD}', PASSWORD_BCRYPT);")
            API_TOKEN=$(php -r "echo bin2hex(random_bytes(30));")

            sudo mysql -u root "${DB_NAME}" -e "
              INSERT INTO users
                (username, password, realname, api_token,
                 status, isdel, isblack,
                 balance, mbalance, paysum,
                 vip, level, exp, fid,
                 isonline, allowagent, loginsum,
                 created_at, updated_at)
              VALUES
                ('alisababi', '${PHP_HASH}', 'alisababi', '${API_TOKEN}',
                 1, 0, 0,
                 0.00, 0.00, 0.00,
                 0, 0, 0, 0,
                 0, 0, 0,
                 NOW(), NOW())
              ON DUPLICATE KEY UPDATE
                password = VALUES(password),
                updated_at = NOW();
            " 2>/dev/null || echo "User insert skipped."

            echo "Default member ready."

            # 7. Clear old cache, refresh assets and permissions
            echo ""
            echo "[7/9] Clearing cache and fixing runtime state..."

            for FRONTEND_DIR in "${DEPLOY_PATH}/wap/static/js" "${DEPLOY_PATH}/web/static/js"; do
              if [ -d "${FRONTEND_DIR}" ]; then
                find "${FRONTEND_DIR}" -name "*.js" -exec sed -i \
                  -e "s|http://127\.0\.2\.6|${ADMIN_URL}|g" \
                  -e "s|https://127\.0\.2\.6|${ADMIN_URL}|g" {} \;
              fi
            done

            php artisan vendor:publish --tag=dcat-admin-assets --force --quiet || true
            php artisan optimize:clear || true
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            php artisan storage:link || true

            sudo chown -R www-data:www-data "${DEPLOY_PATH}"
            sudo find "${DEPLOY_PATH}/admin" -type f -exec chmod 644 {} \;
            sudo find "${DEPLOY_PATH}/admin" -type d -exec chmod 755 {} \;
            sudo chmod -R 775 "${DEPLOY_PATH}/admin/storage"
            sudo chmod -R 775 "${DEPLOY_PATH}/admin/bootstrap/cache"
            sudo chmod -R 755 "${DEPLOY_PATH}/web"
            sudo chmod -R 755 "${DEPLOY_PATH}/wap"

            echo "Cache cleared and permissions fixed."

            # 8. Configure Apache virtual hosts
            echo ""
            echo "[8/9] Configuring Apache virtual hosts..."

            sudo tee "${APACHE_CONF}" > /dev/null <<EOF
            <VirtualHost *:80>
                ServerName ${ADMIN_DOMAIN}
                DocumentRoot ${DEPLOY_PATH}/admin/public

                <Directory ${DEPLOY_PATH}/admin/public>
                    AllowOverride All
                    Require all granted
                    Options +FollowSymLinks -Indexes
                </Directory>

                <FilesMatch \.php$>
                    SetHandler application/x-httpd-php
                </FilesMatch>

                ErrorLog /var/log/apache2/admin-error.log
                CustomLog /var/log/apache2/admin-access.log combined
            </VirtualHost>

            <VirtualHost *:80>
                ServerName ${WEB_DOMAIN}
                ServerAlias www.${WEB_DOMAIN}
                DocumentRoot ${DEPLOY_PATH}/web

                <Directory ${DEPLOY_PATH}/web>
                    AllowOverride All
                    Require all granted
                    Options +FollowSymLinks -Indexes
                    DirectoryIndex index.html index.php
                </Directory>

                ErrorLog /var/log/apache2/web-error.log
                CustomLog /var/log/apache2/web-access.log combined
            </VirtualHost>

            <VirtualHost *:80>
                ServerName ${WAP_DOMAIN}
                DocumentRoot ${DEPLOY_PATH}/wap

                <Directory ${DEPLOY_PATH}/wap>
                    AllowOverride All
                    Require all granted
                    Options +FollowSymLinks -Indexes
                    DirectoryIndex index.html index.php
                </Directory>

                ErrorLog /var/log/apache2/wap-error.log
                CustomLog /var/log/apache2/wap-access.log combined
            </VirtualHost>
            EOF

            if [ -f "/etc/letsencrypt/live/${WEB_DOMAIN}/fullchain.pem" ] && [ -f "/etc/letsencrypt/live/${WEB_DOMAIN}/privkey.pem" ]; then
              sudo tee -a "${APACHE_CONF}" > /dev/null <<EOF
            <IfModule mod_ssl.c>
                <VirtualHost *:443>
                    ServerName ${WEB_DOMAIN}
                    ServerAlias www.${WEB_DOMAIN}
                    DocumentRoot ${DEPLOY_PATH}/web

                    SSLEngine on
                    SSLCertificateFile /etc/letsencrypt/live/${WEB_DOMAIN}/fullchain.pem
                    SSLCertificateKeyFile /etc/letsencrypt/live/${WEB_DOMAIN}/privkey.pem

                    <Directory ${DEPLOY_PATH}/web>
                        AllowOverride All
                        Require all granted
                        Options +FollowSymLinks -Indexes
                        DirectoryIndex index.html index.php
                    </Directory>

                    ErrorLog /var/log/apache2/web-ssl-error.log
                    CustomLog /var/log/apache2/web-ssl-access.log combined
                </VirtualHost>

                <VirtualHost *:443>
                    ServerName ${ADMIN_DOMAIN}
                    DocumentRoot ${DEPLOY_PATH}/admin/public

                    SSLEngine on
                    SSLCertificateFile /etc/letsencrypt/live/${WEB_DOMAIN}/fullchain.pem
                    SSLCertificateKeyFile /etc/letsencrypt/live/${WEB_DOMAIN}/privkey.pem

                    <Directory ${DEPLOY_PATH}/admin/public>
                        AllowOverride All
                        Require all granted
                        Options +FollowSymLinks -Indexes
                    </Directory>

                    <FilesMatch \.php$>
                        SetHandler application/x-httpd-php
                    </FilesMatch>

                    ErrorLog /var/log/apache2/admin-ssl-error.log
                    CustomLog /var/log/apache2/admin-ssl-access.log combined
                </VirtualHost>

                <VirtualHost *:443>
                    ServerName ${WAP_DOMAIN}
                    DocumentRoot ${DEPLOY_PATH}/wap

                    SSLEngine on
                    SSLCertificateFile /etc/letsencrypt/live/${WEB_DOMAIN}/fullchain.pem
                    SSLCertificateKeyFile /etc/letsencrypt/live/${WEB_DOMAIN}/privkey.pem

                    <Directory ${DEPLOY_PATH}/wap>
                        AllowOverride All
                        Require all granted
                        Options +FollowSymLinks -Indexes
                        DirectoryIndex index.html index.php
                    </Directory>

                    ErrorLog /var/log/apache2/wap-ssl-error.log
                    CustomLog /var/log/apache2/wap-ssl-access.log combined
                </VirtualHost>
            </IfModule>
            EOF
            fi

            sudo a2ensite iiit.pro.conf
            sudo a2dissite 000-default.conf 2>/dev/null || true
            sudo apache2ctl configtest
            sudo systemctl restart apache2
            sudo systemctl is-active --quiet apache2

            echo "Checking local vhosts on server..."
            curl -I --max-time 10 -H "Host: ${WEB_DOMAIN}" http://127.0.0.1/ || true
            curl -I --max-time 10 -H "Host: ${ADMIN_DOMAIN}" http://127.0.0.1/ || true
            curl -I --max-time 10 -H "Host: ${WAP_DOMAIN}" http://127.0.0.1/ || true
            sudo ss -ltnp | grep -E ':80|:443' || true

            echo "Apache virtual hosts configured."

            # 9. Finish
            echo ""
            echo "[9/9] Deployment completed - $(date)"
            echo " Admin panel : http://${ADMIN_DOMAIN}/admin"
            echo " PC frontend : http://${WEB_DOMAIN}"
            echo " WAP site    : http://${WAP_DOMAIN}"
            echo " Member user : alisababi / <USER_PASSWORD secret>"
